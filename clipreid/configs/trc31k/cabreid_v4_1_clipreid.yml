MODEL:
  DEVICE_ID: '0'
  PRETRAIN_CHOICE: 'imagenet'
  PRETRAIN_PATH: ''
  METRIC_LOSS_TYPE: 'triplet'
  IF_LABELSMOOTH: 'on'
  IF_WITH_CENTER: 'no'
  NAME: 'ViT-B-16'
  STRIDE_SIZE: [12, 12]
  SIE_CAMERA: False
  SIE_VIEW: False
  ID_LOSS_WEIGHT: 0.25
  TRIPLET_LOSS_WEIGHT: 1.0
  I2T_LOSS_WEIGHT: 1.0

PART_MEMORY:
  ENABLED: True
  SOFT_MASK: True
  MASK_THRESHOLD: 0.45
  BINARY_POOLING: True
  MIN_PART_RATIO: 0.075
  PART_VALIDITY_ENABLED: False
  CAB_INVALID_VIEWIDS: []
  BODY_EXCLUSIVE_FROM_CAB: True
  BODY_VALID_AREA_MINUS_CAB: True
  POOL_BETA: 0.0
  GLOBAL_WEIGHT: 1.0
  CAB_WEIGHT: 0.5
  BODY_WEIGHT: 0.5
  CAB_LOSS_WEIGHT: 1.0
  BODY_LOSS_WEIGHT: 1.0
  MASK_DROPOUT: 0.0
  MEMORY_MOMENTUM: 0.2
  MEMORY_TEMP: 0.05
  ONLINE_MASK: True
  ONLINE_MASK_SOURCE: 'adapter'
  ONLINE_ADAPTER_PATH: '../weights/clip_region_adapter.pt'
  TRAIN_MAIN_FEATURE: 'fused'
  MEMORY_FEATURE: 'fused'
  TEST_FEATURE: 'fused'

INPUT:
  SIZE_TRAIN: [256, 256]
  SIZE_TEST: [256, 256]
  PROB: 0.5
  RE_PROB: 0.5
  PADDING: 10
  PIXEL_MEAN: [0.5, 0.5, 0.5]
  PIXEL_STD: [0.5, 0.5, 0.5]

DATASETS:
  NAMES: 'trc31k'
  ROOT_DIR: '../../dataset'

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 4

SOLVER:
  STAGE1:
    IMS_PER_BATCH: 64
    OPTIMIZER_NAME: 'Adam'
    BASE_LR: 0.00035
    WARMUP_LR_INIT: 0.00001
    LR_MIN: 0.000001
    WARMUP_METHOD: 'linear'
    WEIGHT_DECAY: 0.0001
    WEIGHT_DECAY_BIAS: 0.0001
    MAX_EPOCHS: 60
    CHECKPOINT_PERIOD: 60
    LOG_PERIOD: 50
    WARMUP_EPOCHS: 5
  STAGE2:
    IMS_PER_BATCH: 64
    OPTIMIZER_NAME: 'Adam'
    BASE_LR: 0.000005
    WARMUP_METHOD: 'linear'
    WARMUP_ITERS: 10
    WARMUP_FACTOR: 0.1
    WEIGHT_DECAY: 0.0001
    WEIGHT_DECAY_BIAS: 0.0001
    LARGE_FC_LR: False
    MAX_EPOCHS: 60
    CHECKPOINT_PERIOD: 60
    LOG_PERIOD: 50
    EVAL_PERIOD: 10
    BIAS_LR_FACTOR: 2
    STEPS: [30, 50]
    GAMMA: 0.1

TEST:
  EVAL: True
  IMS_PER_BATCH: 64
  RE_RANKING: False
  WEIGHT: ''
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'

OUTPUT_DIR: '../outputs/v4_1_clipreid'
